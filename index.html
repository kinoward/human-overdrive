<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#080d13" />
    <link rel="stylesheet" href="/src/loading.css" />
    <link rel="preload" as="image" href="/assets/ui-racing/racing-hero-v1.webp" />
    <title>人类超频 · 北京逃亡</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%230a1016'/%3E%3Cpath d='M12 43l14-24h12L24 43zm19 0l14-24h7L38 43z' fill='%23dcf45b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="game-viewport">
    <div id="scene" inert></div>
    <div id="app" inert aria-busy="true"></div>
    <section id="loading-screen" class="loading-screen" aria-labelledby="loading-title">
      <div class="loading-content">
        <svg class="loading-logo" viewBox="0 0 38 28" aria-hidden="true"><path d="M0 26 15 1h10L10 26zm19 0L34 1h4L23 26z" fill="currentColor"/></svg>
        <p class="loading-eyebrow">人类超频 · 北京逃亡</p>
        <h1 id="loading-title">正在准备出发</h1>
        <div class="loading-status"><p id="loading-message" role="status">正在载入游戏程序</p><span id="loading-value" aria-hidden="true">请稍候</span></div>
        <div id="loading-progress" class="loading-progress is-indeterminate" role="progressbar" aria-label="游戏准备进度" aria-valuemin="0" aria-valuemax="100" aria-valuetext="正在载入游戏程序"><span></span></div>
        <p class="loading-hint">首次加载需要准备道路、车辆与城市场景</p>
        <button id="loading-retry" type="button" hidden>重新载入</button>
      </div>
    </section>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
